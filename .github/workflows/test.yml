name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    # inject dummy creds so supabase.create_client() never errors
    env:
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_KEY: dummykey
      SUPABASE_KEY: dummykey
      OPEN_API_KEY: dummyopenai

    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/
