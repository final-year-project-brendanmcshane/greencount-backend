name: Run Dummy Test
//

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Create Dummy Test
        run: |
          mkdir -p tests
          echo "def test_dummy(): assert True" > tests/test_dummy.py

      - name: Run Dummy Test
        run: pytest tests/test_dummy.py