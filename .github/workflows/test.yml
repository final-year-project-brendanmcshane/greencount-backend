    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set dummy env variables
        run: |
          echo "SUPABASE_URL=https://dummy.supabase.co" >> .env
          echo "SUPABASE_KEY=dummykey" >> .env
          echo "SUPABASE_SERVICE_KEY=dummykey" >> .env
          echo "OPEN_API_KEY=dummyopenai" >> .env

      - name: Run tests
        run: |
          pytest tests/
